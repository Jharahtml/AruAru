<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recursos</title>
    <link rel="stylesheet" href="../src/style.css" />
    <link rel="icon"type="image/png" href="../src/assets/img/favicon.png">

  </head>
  <body>
    <header>
      <div id="menu"></div>
    </header>
    <main>
      <section class="section-t">
        <div class="container">
          <h1 class="inclinado h-center animar-scroll">Recursos</h1>
          <div class="recursos-main">
            <div class="recurso-container wrapper animar-scroll">
              <div class="recurso-img">
                <img
                  src="../src/assets/img/fichas-miniatura.png"
                  alt="Fichas-miniatura"
                />
              </div>
              <div class="recursos-info">
                <h3 class="t-azul">Fichas de tablero</h3>
                <p>Encuentra la plantilla de fichas de recorte para el tablero</p>
                <div class="botones-recursos animar-scroll image-scroll">
                  <a class="boton-ver bg-amarillo" href="../src/assets/documents/Plantilla-fichas.pdf" target="_blank"
                    >Ver</a
                  >
                  <a class="bg-azul" href="../src/assets/documents/Plantilla-fichas.pdf" download
                    >Descargar</a
                  >
                </div>
              </div>
            </div>
            <div class="recurso-container wrapper animar-scroll">
              <div class="recurso-img">
                <img
                  src="../src/assets/img/personaje-miniatura.png"
                  alt="Fichas personaje-miniatura"
                />
              </div>
              <div class="recursos-info">
                <h3 class="t-naranja">Fichas de personaje</h3>
                <p>Encuentra las fichas del personaje.</p>
                <div class="botones-recursos animar-scroll image-scroll">
                  <a class="boton-ver bg-amarillo" href="../src/assets/" target="_blank"
                    >Ver</a
                  >
                  <a class="bg-azul" href="../src/assets/" download
                    >Descargar</a
                  >
                </div>
              </div>
            </div>
            <div class="recurso-container wrapper animar-scroll">
              <div class="recurso-img">
                <img
                  src="../src/assets/img/hoja-miniatura.png"
                  alt="Hoja-miniatura"
                />
              </div>
              <div class="recursos-info">
                <h3 class="t-verde">Fichas de tablero</h3>
                <p>Encuentra la plantilla para las respuestas.</p>
                <div class="botones-recursos animar-scroll image-scroll">
                  <a class="boton-ver bg-amarillo" href="../src/assets/documents/Plantilla-para-respuestas.pdf" target="_blank"
                    >Ver</a
                  >
                  <a class="bg-azul" href="../src/assets/documents/Plantilla-para-respuestas.pdf" download
                    >Descargar</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="../src/js/main.js"></script>
  </body>
</html>
